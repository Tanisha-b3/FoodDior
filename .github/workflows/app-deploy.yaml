name: Deploy Frontend and Backend

on:
  workflow_dispatch:
  push:
    paths:
      - 'frontend/**'
      - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # FRONTEND BUILD
      - run: npm install
        working-directory: frontend

      - run: npm run build
        working-directory: frontend

      # BACKEND DEPENDENCIES
      - run: npm install
        working-directory: backend

      # SSH SETUP
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      # CREATE DIRECTORIES
      - name: Prepare EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << EOF
          sudo mkdir -p /var/www/frontend /var/www/backend
          sudo chown -R ec2-user:ec2-user /var/www
          EOF

      # UPLOAD FILES
      - name: Upload files
        run: |
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa -r frontend/dist/* ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/var/www/frontend/
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa -r backend/* ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/var/www/backend/

      # DEPLOY + CONFIGURE SERVER
      - name: Deploy App
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << EOF

          # FRONTEND → NGINX
          sudo rm -rf /usr/share/nginx/html/*
          sudo cp -r /var/www/frontend/* /usr/share/nginx/html/

          # BACKEND SETUP
          cd /var/www/backend
          npm install

          echo "MONGODB_URI=${{ secrets.MONGODB_URI }}" > .env
          echo "PORT=${{ secrets.BACKEND_PORT }}" >> .env

          # PM2 START
          pm2 delete backend || true
          pm2 start index.js --name backend
          pm2 save

          # NGINX CONFIG (API ROUTE)
          sudo tee /etc/nginx/conf.d/app.conf > /dev/null <<EOL
          server {
              listen 80;

              location / {
                  root /usr/share/nginx/html;
                  index index.html;
                  try_files \$uri /index.html;
              }

              location /api/ {
                  proxy_pass http://localhost:5000/;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade \$http_upgrade;
                  proxy_set_header Connection 'upgrade';
                  proxy_set_header Host \$host;
                  proxy_cache_bypass \$http_upgrade;
              }
          }
EOL

          sudo systemctl restart nginx

          EOF
