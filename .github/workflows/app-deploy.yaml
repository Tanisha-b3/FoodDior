name: Deploy Frontend and Backend

on:
  workflow_dispatch:
  push:
    paths:
      - 'frontend/**'
      - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      # Add deployment steps here, e.g., SCP to EC2, S3 upload, or SSH commands
      # Example: Copy build to EC2 (requires SSH key in secrets and EC2 public IP)
      - name: Add SSH key
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
        env:
          EC2_KEY: ${{ secrets.EC2_KEY }}

      - name: Deploy to EC2 (example)
        run: |
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa -r frontend/dist/* $EC2_USER@$EC2_HOST:/var/www/frontend/
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa -r backend/* $EC2_USER@$EC2_HOST:/var/www/backend/
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}

      - name: Create backend .env file
        run: |
          echo "MONGODB_URI=${{ secrets.MONGODB_URI }}" > backend/.env
          echo "PORT=${{ secrets.BACKEND_PORT }}" >> backend/.env

      - name: Create frontend .env file
        run: |
          echo "VITE_API_URL=${{ secrets.VITE_API_URL }}" > frontend/.env
